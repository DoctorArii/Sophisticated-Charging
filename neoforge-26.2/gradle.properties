org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Compiled against (and the dev game runs) the oldest NeoForge it declares: 26.2.0.57 is the first stable 26.2 build.
# Boot the release jar on the newest one too before a release.
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.57
neo_version_range=[26.2.0.57,)

mod_id=sophisticatedcharging
mod_name=Sophisticated Charging
mod_license=MIT
mod_version=1.2.0
mod_group_id=com.doctorarii.sophisticatedcharging
mod_authors=DoctorArii

# Compiled against the oldest supported versions (*_min_version), tested against those and the newest (*_version).
# The ranges are what the mod declares it works with. No major pack ships SB for 26.2 yet; the oldest is the first SB
# that loads on a stable NeoForge 26.2 (3.25.74 to 3.25.83 were made for NeoForge 26.2 betas and use an event class it
# no longer has).
sophisticated_core_min_version=26.2-1.4.90.2199
sophisticated_backpacks_min_version=26.2-3.25.84.2026
sophisticated_core_version=26.2-1.5.18.2438
sophisticated_backpacks_version=26.2-3.26.16.2233
sophisticated_core_range=[1.4.90,)
sophisticated_backpacks_range=[3.25.84,)
curios_version=16.0.0+26.2
