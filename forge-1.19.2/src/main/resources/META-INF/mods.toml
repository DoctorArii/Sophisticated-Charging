modLoader="javafml"
loaderVersion="[43,)"
license="${mod_license}"

[[mods]]
modId="sophisticatedcharging"
version="${mod_version}"
displayName="Sophisticated Charging"
authors="${mod_authors}"
logoFile="logo.png"
description='''
Charging Upgrades for Sophisticated Backpacks.
- Every battery you put in the backpack, from any mod, joins one shared energy pool.
- The pool charges your armor and held tools while you carry or wear the backpack.
- The Advanced Charging Upgrade also charges your whole inventory, Curios slots and tools stored in the backpack, with a filter.
- Cables and chargers see the whole backpack as one big battery.
- Server owners can ban items, whole mods or tags as batteries or as charge targets, and infinite (creative) batteries are left out by default.
'''

[[dependencies.sophisticatedcharging]]
    modId="forge"
    mandatory=true
    versionRange="[43.2,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.sophisticatedcharging]]
