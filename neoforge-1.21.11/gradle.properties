org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Compiled against (and the dev game runs) the oldest NeoForge it declares: 21.11.42 is the first stable 1.21.11
# build. Boot the release jar on the newest one too before a release.
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
neo_version=21.11.42
neo_version_range=[21.11.42,)

mod_id=sophisticatedcharging
mod_name=Sophisticated Charging
mod_license=MIT
mod_version=1.2.0
mod_group_id=com.doctorarii.sophisticatedcharging
mod_authors=DoctorArii

# Compiled against the oldest supported versions (*_min_version), tested against those and the newest (*_version).
# The ranges are what the mod declares it works with. No major pack ships SB for 1.21.11; the oldest is the first SB/Core
# that keep a backpack's copies in sync (Core 1.4.42): with older ones, energy taken through the backpack as an item
# (a charger slot) lands in a separate copy of it, which can duplicate energy.
sophisticated_core_min_version=1.21.11-1.4.42.1900
sophisticated_backpacks_min_version=1.21.11-3.25.54.1793
sophisticated_core_version=1.21.11-1.5.2.2348
sophisticated_backpacks_version=1.21.11-3.26.3.2168
sophisticated_core_range=[1.4.42,)
sophisticated_backpacks_range=[3.25.54,)
curios_version=14.0.0+1.21.11
