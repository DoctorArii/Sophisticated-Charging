plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id
base { archivesName = mod_id }

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

// Optional local settings for the dev game, not part of the repository.
if (file('local.gradle').exists()) {
    apply from: 'local.gradle'
}

// Compiled against the oldest supported Sophisticated Backpacks/Core (so nothing newer is used by accident); the dev game
// runs the newest.
dependencies {
    compileOnly "maven.modrinth:sophisticated-core:${sophisticated_core_min_version}"
    compileOnly "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_min_version}"
    runtimeOnly "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
    runtimeOnly "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}"
    // Optional: charging items in Curios slots.
    compileOnly "maven.modrinth:curios:${curios_version}"
    runtimeOnly "maven.modrinth:curios:${curios_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range      : minecraft_version_range,
            neo_version_range            : neo_version_range,
            mod_id                       : mod_id,
            mod_name                     : mod_name,
            mod_license                  : mod_license,
            mod_version                  : mod_version,
            mod_authors                  : mod_authors,
            sophisticated_core_range     : sophisticated_core_range,
            sophisticated_backpacks_range: sophisticated_backpacks_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    // Resolved now: the configuration cache can't read project properties while the task runs.
    var licenseName = "LICENSE_${mod_id}"
    from('../LICENSE') { rename { licenseName } }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}
