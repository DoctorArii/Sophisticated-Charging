org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# neo_version is what the dev game runs; neo_version_range is what the mod declares. Boot the release jar on the
# oldest NeoForge in the range (26.3.0.76 is the first stable 26.3 build) before a release.
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
neo_version=26.3.0.99
neo_version_range=[26.3.0.76,)

mod_id=sophisticatedcharging
mod_name=Sophisticated Charging
mod_license=MIT
mod_version=1.2.0
mod_group_id=com.doctorarii.sophisticatedcharging
mod_authors=DoctorArii

# Compiled against the oldest supported versions (*_min_version), tested against those and the newest (*_version).
# The ranges are what the mod declares it works with. No major pack ships SB for 26.3 yet; the oldest is the first SB/Core
# that load on NeoForge 26.3 (SB 3.26.4 and Core 1.5.1 still use the config types FML 12 removed).
sophisticated_core_min_version=26.3-1.5.2.2355
sophisticated_backpacks_min_version=26.3-3.26.5.2181
sophisticated_core_version=26.3-1.5.20.2436
sophisticated_backpacks_version=26.3-3.26.17.2230
sophisticated_core_range=[1.5.2,)
sophisticated_backpacks_range=[3.26.5,)
curios_version=17.0.0-beta.3+26.3
