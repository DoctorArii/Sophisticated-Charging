modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="logo.png"
description='''
Charging Upgrades for Sophisticated Backpacks.
- Every battery you put in the backpack, from any mod, joins one shared energy pool.
- The pool charges your armor and held tools while you carry or wear the backpack.
- The Advanced Charging Upgrade also charges your whole inventory, Curios slots and tools stored in the backpack, with a filter.
- Cables and chargers see the whole backpack as one big battery.
- Server owners can ban items, whole mods or tags as batteries or as charge targets, and infinite (creative) batteries are left out by default.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sophisticatedcore"
    type="required"
    versionRange="${sophisticated_core_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sophisticatedbackpacks"
    type="required"
    versionRange="${sophisticated_backpacks_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[15,)"
    ordering="NONE"
    side="BOTH"
