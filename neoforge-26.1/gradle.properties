org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Compiled against (and the dev game runs) the oldest NeoForge it declares: 26.1.2.71 is the first stable 26.1.2
# build (there is no stable NeoForge for 26.1 and 26.1.1, so the range starts at 26.1.2). minecraft_version only names
# the jar (sophisticatedcharging-26.1-..., like the target). Boot the release jar on the newest NeoForge too before a release.
minecraft_version=26.1
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.71
neo_version_range=[26.1.2.71,)

mod_id=sophisticatedcharging
mod_name=Sophisticated Charging
mod_license=MIT
mod_version=1.2.0
mod_group_id=com.doctorarii.sophisticatedcharging
mod_authors=DoctorArii

# Compiled against the oldest supported versions (*_min_version), tested against those and the newest (*_version).
# The ranges are what the mod declares it works with. The oldest is what the oldest major pack ships (FTB Unstable 6;
# FTB Evolution 2 and All the Mods 11 ship newer ones). Older SB/Core keep separate copies of a backpack apart when its
# energy is used as an item (no wrapper sync before Core 1.4.42), which can duplicate energy.
sophisticated_core_min_version=26.1.2-1.5.2.2347
sophisticated_backpacks_min_version=26.1.2-3.26.3.2169
sophisticated_core_version=26.1.2-1.5.20.2437
sophisticated_backpacks_version=26.1.2-3.26.17.2229
sophisticated_core_range=[1.5.2,)
sophisticated_backpacks_range=[3.26.3,)
curios_version=15.0.0+26.1.2
